# Build Windows and macOS installers only at requested release checkpoints.
# These are unsigned acceptance bundles, never automatically published releases.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  bundle:
    name: bundle (${{ matrix.target }})
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
          - os: windows-2025
            target: aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
            bundles: nsis
          # Ubuntu 22.04: packages built against its glibc run on it and every newer distribution.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Keep LF line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: ${{ matrix.rust-targets }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev patchelf rpm
          # The AppImage carries GStreamer's base and good plugins (scripts/appimage-media.mjs).
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-gl gstreamer1.0-alsa gstreamer1.0-pulseaudio
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          key: ${{ matrix.target }}
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Check committed Rust bindings before building the frontend
        run: bash .github/scripts/export-bindings.sh check "$RUNNER_TEMP/bindings-build"
      - name: Use an ad-hoc signature (macOS)
        if: runner.os == 'macOS'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
      - name: Select Clang for the Windows ARM64 speech engine
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          # Keep host binding generation and the x64 bundle on their existing toolchains.
          # Visual Studio's own Clang matches its STL; the image's separate LLVM can be older than that
          # STL accepts (Clang 20 against MSVC 14.52, which asks for 22, on 24 November 2026).
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $bundled = if (Test-Path $vswhere) {
            & $vswhere -latest -products * -find 'VC\Tools\Llvm\x64\bin\clang-cl.exe' | Select-Object -First 1
          }
          if ($bundled) {
            Split-Path $bundled >> $env:GITHUB_PATH
            & $bundled --version
          }
          Get-Command ninja.exe, clang-cl.exe -ErrorAction Stop | Out-Null
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          $toolchain = Join-Path $env:GITHUB_WORKSPACE '.github/cmake/windows-arm64-clang.cmake'
          "CMAKE_TOOLCHAIN_FILE=$($toolchain.Replace('\', '/'))" >> $env:GITHUB_ENV
      - name: Build unsigned bundles
        env:
          BUNDLE_TARGET: ${{ matrix.target }}
          BUNDLE_FORMATS: ${{ matrix.bundles }}
          # The AppImage tools run from their own extraction instead of needing FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm --filter @o7/desktop bundle --target "$BUNDLE_TARGET" --bundles "$BUNDLE_FORMATS"
      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auracode-unsigned-${{ matrix.target }}-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
      - name: Keep a cancelled build out of the cache
        if: cancelled()
        run: echo "CACHE_ON_FAILURE=false" >> "$GITHUB_ENV"
