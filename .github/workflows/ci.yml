# Deliberate integration and final verification only. Routine commits and pushes run no CI.
# The active product targets are Windows, macOS and Linux.
# Use the supported Intel macOS pool after arm64 runner acquisition failed in final CI.
name: CI

on:
  workflow_dispatch:
    inputs:
      refresh_bindings:
        description: Generate bindings on macOS before frontend checks and publish parity artifacts
        type: boolean
        default: false
        required: false
      checkpoint_benchmarks:
        description: Run only the checkpoint baseline comparisons (skip app and UI jobs)
        type: boolean
        default: false
        required: false
      checkpoint_baseline_ref:
        description: Baseline commit or ref for the optional checkpoint comparison
        type: string
        default: af499cd05684df8d2f08e48af21d268b522862f7
        required: false
      checkpoint_counts:
        description: One to three comma-separated fixture sizes, each from 1 to 20000
        type: string
        default: "1000,10000,20000"
        required: false
      checkpoint_warm_samples:
        description: Unchanged synthetic capture samples per fixture size, from 1 to 10
        type: string
        default: "1"
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.checkpoint_benchmarks && '-checkpoint-benchmarks' || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  bindings:
    name: bootstrap bindings (macOS)
    if: inputs.refresh_bindings && !inputs.checkpoint_benchmarks
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Export exact bindings
        run: bash .github/scripts/export-bindings.sh refresh "$RUNNER_TEMP/bindings-bootstrap"
      - name: Publish exact generated bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-bootstrap-${{ github.sha }}
          path: ${{ runner.temp }}/bindings-bootstrap/bindings.ts
          if-no-files-found: error
          retention-days: 7
  lint:
    name: lint
    needs: bindings
    if: ${{ !cancelled() && !inputs.checkpoint_benchmarks && (needs.bindings.result == 'success' || needs.bindings.result == 'skipped') }}
    runs-on: macos-26-intel
    # The browser checks here take about 2.4 times as long as on a desktop (measured 2026-11-09),
    # and a step or job cut off at its limit wastes every minute before it, so the limits leave room.
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use generated bindings for this explicit refresh run
        if: inputs.refresh_bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindings-bootstrap-${{ github.sha }}
          path: apps/desktop/src
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Rust
        id: ready
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Lint (Biome)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: pnpm typecheck

      - name: Test (TypeScript)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: pnpm test

      - name: Build and verify the static website runtime
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install worker-build --version 0.8.7 --locked
          pnpm --filter @o7/web-worker worker:build
          pnpm --filter @o7/web-worker worker:test

      - name: Install browser test engines
        id: browsers
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: pnpm --filter @o7/desktop exec playwright install --with-deps chromium webkit

      # One engine per step, so each fits its deadline (about 6 and 9 minutes here).
      - name: Check the chat in Chromium
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        run: pnpm --filter @o7/desktop check:chat --engines chromium

      - name: Check the chat in WebKit
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        run: pnpm --filter @o7/desktop check:chat --engines webkit

      - name: Check settings and explicit update controls in Chromium
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        run: pnpm --filter @o7/desktop check:settings --engines chromium

      - name: Check settings and explicit update controls in WebKit
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        run: pnpm --filter @o7/desktop check:settings --engines webkit

      - name: Check the Plugin library, instructions, folders, publication and agent accounts
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          pnpm --filter @o7/desktop exec node scripts/check-plugin-library.mjs
          pnpm --filter @o7/desktop exec node scripts/check-instructions.mjs
          pnpm --filter @o7/desktop exec node scripts/check-folder-resolution.mjs
          pnpm --filter @o7/desktop exec node scripts/check-repository-publication.mjs
          pnpm --filter @o7/desktop exec node scripts/check-workspace-removal.mjs
          pnpm --filter @o7/desktop exec node scripts/check-agent-installations.mjs
          pnpm --filter @o7/desktop exec node scripts/check-accounts.mjs

      - name: Check explicit installer and clone actions
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 5
        run: pnpm --filter @o7/desktop exec node scripts/check-setup-actions.mjs

      - name: Check the sidebar footer
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 5
        run: pnpm --filter @o7/desktop exec node scripts/check-sidebar-footer.mjs

      - name: Check the app update button
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 10
        run: pnpm --filter @o7/desktop exec node scripts/check-app-update.mjs

      - name: Check coordinated projects
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 10
        run: pnpm --filter @o7/desktop exec node scripts/check-coordinator.mjs

      - name: Check New chat's worktree choice
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 5
        run: pnpm --filter @o7/desktop exec node scripts/check-new-chat-worktree.mjs

      - name: Check Customize, native controls, project memory and shared MCP fixtures
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        run: pnpm --filter @o7/desktop check:customization

      - name: Check the docked terminal panel
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 5
        run: pnpm --filter @o7/desktop exec node scripts/check-terminal-panel.mjs

      # Fourteen checks in two engines took 16 minutes on GitHub's Macs by November 2026, past one
      # step's 15: the suite runs in two parts.
      - name: Check dictation, images, the Dashboard, typing, update notices, terminal chats and Canvas
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        run: pnpm --filter @o7/desktop exec node scripts/check-fixture-suite.mjs --part 1

      - name: Check the browser, the Device pane, opening, the tour, plans and reading aloud
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        run: pnpm --filter @o7/desktop exec node scripts/check-fixture-suite.mjs --part 2

      - name: Check Delete all o7 data
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 5
        run: pnpm --filter @o7/desktop exec node scripts/check-delete-data.mjs

      - name: Check explicit chat sign-in recovery
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 5
        run: pnpm --filter @o7/desktop exec node scripts/check-chat-auth.mjs

      - name: Check the website and verified release downloads
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          pnpm --filter @o7/web test:release
          pnpm --filter @o7/web test:browser

      - name: Keep Library, settings and website browser evidence
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: library-web-browser
          path: |
            target/library-browser
            target/folder-resolution-browser
            target/repository-publication-browser
            target/workspace-removal-browser
            target/delete-data-browser
            target/agent-installations-browser
            target/setup-actions-browser
            target/sidebar-footer-browser
            target/chat-auth-browser
            target/customization-browser
            target/project-memory-browser
            target/shared-mcp-browser
            target/dictation-browser
            target/images-browser
            target/dashboard-browser
            target/agent-updates-browser
            target/terminal-chat-browser
            target/web-checks
            target/release-preview-*/*.png
          retention-days: 7

      - name: Keep chat browser evidence
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-browser
          path: target/chat-browser
          retention-days: 7

      - name: Keep settings and Git review evidence
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-browser
          path: target/settings-browser
          retention-days: 7

      - name: Check setup in Chromium and WebKit
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 10
        run: pnpm --filter @o7/desktop check:setup
      - name: Keep setup browser evidence
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-browser
          path: target/setup-browser
          retention-days: 7

      - name: Check Rust formatting
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo fmt --all --check
      - name: Check the spike docs
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo test --manifest-path docs/spikes/doc-check/Cargo.toml --locked
      - name: Check the workflows
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bash .github/scripts/lint-workflows.sh

      - name: Install ShellCheck if needed
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: command -v shellcheck >/dev/null || brew install shellcheck

      - name: Check the CI scripts (ShellCheck)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: shellcheck -x .github/scripts/*.sh

      - name: Test the CI scripts
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          node --test .github/scripts/acceptance-gates.test.mjs .github/scripts/webdriver-smoke.test.mjs .github/scripts/release-plan.test.mjs
          bash .github/scripts/test.sh
          bash .github/scripts/test-export-bindings.sh
  layout:
    name: layout (${{ matrix.engine }}, ${{ matrix.theme }})
    needs: bindings
    if: ${{ !cancelled() && !inputs.checkpoint_benchmarks && (needs.bindings.result == 'success' || needs.bindings.result == 'skipped') }}
    runs-on: macos-26-intel
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        theme: [light, dark]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use generated bindings for this explicit refresh run
        if: inputs.refresh_bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindings-bootstrap-${{ github.sha }}
          path: apps/desktop/src
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser test engine
        run: pnpm --filter @o7/desktop exec playwright install --with-deps ${{ matrix.engine }}
      - name: Check every preview's layout
        timeout-minutes: 20
        run: >-
          pnpm --filter @o7/desktop exec node scripts/check-layout.mjs
          --engines ${{ matrix.engine }} --themes ${{ matrix.theme }}
          --sizes 1440x900,960x640 --focus-steps 120
      - name: Keep layout evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layout-browser-${{ matrix.engine }}-${{ matrix.theme }}
          path: target/layout-browser
          if-no-files-found: warn
          retention-days: 7
  powershell:
    name: powershell (windows-2025)
    if: ${{ !inputs.checkpoint_benchmarks }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Check out
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            docs/spikes/render-power
            .github/scripts
      - name: Test the render-power suite (Windows PowerShell 5.1)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File docs/spikes/render-power/test-render-power.ps1

      - name: Test the render-power suite (PowerShell 7)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: pwsh -NoProfile -File docs/spikes/render-power/test-render-power.ps1

      - name: Test WebDriver provisioning without network or native executables
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: pwsh
        run: ./.github/scripts/test-prepare-webdriver.ps1

  rust:
    name: rust (${{ matrix.os }})
    if: ${{ !inputs.checkpoint_benchmarks }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26-intel
          - windows-2025
          # The release packages' build system (build.yml), so the oldest supported libraries.
          - ubuntu-22.04
    runs-on: ${{ matrix.os }}
    # A branch's first run builds without a cache, and a cut-off run saves none: on Windows that
    # took 27 minutes of Clippy and 39 of tests before the smoke steps (2026-11-09).
    timeout-minutes: 120
    steps:
      - name: Keep LF line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev xvfb
      - name: Cache Rust build
        id: ready
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            docs/spikes/windows-spawn -> target
            docs/spikes/claude-control -> target
          cache-on-failure: true
      - name: Clippy
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Continue with remaining checks
        id: full
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: echo "Running the remaining checks on $RUNNER_OS."
      - name: Test
        if: ${{ !cancelled() && steps.full.outcome == 'success' }}
        run: cargo test --workspace --locked --no-fail-fast
      - name: Check generated TypeScript bindings
        id: bindings
        if: ${{ !cancelled() && steps.full.outcome == 'success' }}
        env:
          BINDINGS_MODE: ${{ inputs.refresh_bindings && 'refresh' || 'check' }}
        run: bash .github/scripts/export-bindings.sh "$BINDINGS_MODE" "$RUNNER_TEMP/bindings-$RUNNER_OS"
      - name: Publish independently generated bindings
        if: ${{ !cancelled() && steps.bindings.outputs.generated == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/bindings-${{ runner.os }}/bindings.ts
          if-no-files-found: error
          retention-days: 7
      - name: Build the Windows spawning spike
        id: spawn-build
        if: ${{ !cancelled() && steps.full.outcome == 'success' && runner.os == 'Windows' }}
        timeout-minutes: 20
        env: &spawn_env
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: >-
          cargo test --manifest-path docs/spikes/windows-spawn/Cargo.toml --locked --no-run
          --message-format=json-render-diagnostics > "$RUNNER_TEMP/windows-spawn-build.jsonl"

      - name: Test the Windows spawning spike (unit tests)
        if: ${{ !cancelled() && steps.spawn-build.outcome == 'success' }}
        timeout-minutes: 10
        env: *spawn_env
        run: cargo test --manifest-path docs/spikes/windows-spawn/Cargo.toml --locked --lib --bins

      - name: Stage the Windows spawning spike
        id: spawn-stage
        if: ${{ !cancelled() && steps.spawn-build.outcome == 'success' }}
        run: >-
          bash .github/scripts/stage-spawn-spike.sh "$RUNNER_TEMP/windows-spawn-build.jsonl"
          "$RUNNER_TEMP/windows-spawn-spike"
      - name: Test the Windows spawning spike (integration tests)
        if: ${{ !cancelled() && steps.spawn-stage.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: ${{ runner.temp }}/windows-spawn-spike
        env:
          TEST_EXE: ${{ steps.spawn-stage.outputs.test_exe }}
        run: '"$TEST_EXE"'
      - name: Upload the Windows spawning spike (Windows)
        if: ${{ !cancelled() && steps.spawn-stage.outcome == 'success' && runner.os == 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-spawn-spike-${{ github.sha }}
          path: ${{ runner.temp }}/windows-spawn-spike
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Build the Claude control spike (compile only)
        if: ${{ !cancelled() && steps.full.outcome == 'success' }}
        run: cargo build --manifest-path docs/spikes/claude-control/Cargo.toml --locked
      - name: Test the Claude control spike (unit tests)
        if: ${{ !cancelled() && steps.full.outcome == 'success' }}
        run: cargo test --manifest-path docs/spikes/claude-control/Cargo.toml --locked
      - name: Set up pnpm (smoke)
        id: pnpm
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (smoke)
        id: node
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies (smoke)
        id: js
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: pnpm install --frozen-lockfile
      - name: Build the app with its frontend embedded (smoke)
        id: smoke-build
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        timeout-minutes: 30
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: pnpm --filter @o7/desktop tauri build --debug --no-bundle
      - name: Smoke test the app (streams)
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          binary=target/debug/o7
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          # Linux has no display on the runner: a virtual one, at the window's default size.
          display=()
          if [ "$RUNNER_OS" = Linux ]; then display=(xvfb-run -a -s "-screen 0 1440x900x24"); fi
          "${display[@]}" bash .github/scripts/run-smoke.sh "$binary" stream
      - name: Smoke test the chat UI
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          binary=target/debug/o7
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          # Linux has no display on the runner: a virtual one, at the window's default size.
          display=()
          if [ "$RUNNER_OS" = Linux ]; then display=(xvfb-run -a -s "-screen 0 1440x900x24"); fi
          "${display[@]}" bash .github/scripts/run-smoke.sh "$binary" chat
      - name: Install pinned external WebDriver bridge (Windows)
        id: webdriver-tools
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'Windows' }}
        timeout-minutes: 10
        run: cargo install tauri-driver --version 2.1.0 --locked --root "$RUNNER_TEMP/webdriver-tools"
      - name: Prepare matching Microsoft Edge Driver (Windows)
        id: webdriver-native
        if: ${{ !cancelled() && steps.webdriver-tools.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh
        run: ./.github/scripts/prepare-webdriver.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'webdriver-native')
      - name: External WebDriver smoke of the real Windows app
        if: ${{ !cancelled() && steps.webdriver-native.outcome == 'success' }}
        timeout-minutes: 8
        env:
          NATIVE_DRIVER: ${{ steps.webdriver-native.outputs.native_driver }}
          EXPECTED_WEBVIEW_VERSION: ${{ steps.webdriver-native.outputs.webview_version }}
        run: >-
          node .github/scripts/webdriver-smoke.mjs "$GITHUB_WORKSPACE/target/debug/o7.exe"
          "$RUNNER_TEMP/webdriver-tools/bin/tauri-driver.exe" "$NATIVE_DRIVER"
          "$RUNNER_TEMP/webdriver-evidence"
      - name: Keep external Windows WebDriver evidence
        if: ${{ !cancelled() && steps.webdriver-tools.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-webdriver-${{ github.sha }}
          path: |
            ${{ runner.temp }}/webdriver-evidence
            ${{ runner.temp }}/webdriver-native/versions.json
          if-no-files-found: warn
          retention-days: 7
      - name: Keep native smoke evidence
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-smoke-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/auracode-smoke*.stdout
          if-no-files-found: warn
          retention-days: 7
      - name: Keep a cancelled build out of the cache
        if: cancelled()
        run: echo "CACHE_ON_FAILURE=false" >> "$GITHUB_ENV"
  # The default baseline predates the Linux port, so the comparison runs on macOS and Windows.
  checkpoint-benchmarks:
    name: checkpoint benchmarks (${{ matrix.os }})
    if: inputs.checkpoint_benchmarks
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The baseline commit must be in the fetched history.
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - name: Cache the benchmark build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: checkpoint-benchmarks
          cache-on-failure: true
      - name: Compare checkpoint capture and native prompt latency
        env:
          CHECKPOINT_BASELINE_REF: ${{ inputs.checkpoint_baseline_ref }}
          O7_CHECKPOINT_BENCH_COUNTS: ${{ inputs.checkpoint_counts }}
          O7_CHECKPOINT_BENCH_WARM: ${{ inputs.checkpoint_warm_samples }}
          O7_CHECKPOINT_BENCH_DIAGNOSTICS: "1"
        run: bash .github/scripts/checkpoint-performance.sh
      - name: Keep checkpoint performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkpoint-performance-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/checkpoint-performance-evidence
          if-no-files-found: warn
          retention-days: 14
  bindings-parity:
    name: generated binding parity
    needs: [bindings, rust]
    if: ${{ !cancelled() && !inputs.checkpoint_benchmarks && inputs.refresh_bindings && needs.bindings.result == 'success' }}
    runs-on: macos-26-intel
    timeout-minutes: 5
    steps:
      - name: Read macOS bootstrap bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindings-bootstrap-${{ github.sha }}
          path: bootstrap
      - name: Read independently generated Windows bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindings-Windows-${{ github.sha }}
          path: windows
      - name: Compare exact output across platforms
        run: cmp bootstrap/bindings.ts windows/bindings.ts
