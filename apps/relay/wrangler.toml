# The remote-sessions relay: one Durable Object per desktop, holding its sockets. It stores the
# hash of a desktop's key, the hashes of its bot tokens and when its recent notifications went
# out; no D1, R2 or KV. One more Durable Object, Apns, signs notifications for Apple and keeps the
# token it signs with.
# Its one secret is Apple's push key, APNS_KEY, which is not in this file: the owner sets it with
# `wrangler secret put APNS_KEY --env <env>`, and APNS_KEY_ID and APNS_TEAM_ID below. Push is off
# while any of the three is empty.
# Default bindings are local-only. Production requires explicit --env production.
name = "o7-relay-local"
main = "src/index.ts"
compatibility_date = "2026-10-26"
workers_dev = false
preview_urls = false

[vars]
APP_ORIGIN = "http://localhost:1429"
# Where Apple delivers notifications (the iPhone app), the push key's id and its team's.
APNS_TOPIC = "codes.o7.mobile"
APNS_KEY_ID = ""
APNS_TEAM_ID = ""

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "APNS"
class_name = "Apns"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Apns"]

[observability]
enabled = false

[env.production]
name = "o7-relay"
account_id = "5feb14f2fe605875bcf1472f348cb7ed"
# More specific than the website's `o7.codes/*`, so these requests reach this Worker.
# The second route and FORMER_ORIGIN are the address the site had until 19 November 2026: a copy
# of the app from before the move connects there, and a phone paired there opens the remote page
# there. Both addresses reach the same rooms. They go once those copies have updated.
routes = [
  { pattern = "o7.codes/api/remote/*", zone_name = "o7.codes" },
  { pattern = "auracode.si/api/remote/*", zone_name = "auracode.si" },
]

[env.production.vars]
APP_ORIGIN = "https://o7.codes"
FORMER_ORIGIN = "https://auracode.si"
APNS_TOPIC = "codes.o7.mobile"
APNS_KEY_ID = ""
APNS_TEAM_ID = ""

[[env.production.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.production.durable_objects.bindings]]
name = "APNS"
class_name = "Apns"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["Apns"]

[env.preview]
name = "o7-relay-preview"
account_id = "5feb14f2fe605875bcf1472f348cb7ed"
routes = [{ pattern = "preview.o7.codes/api/remote/*", zone_name = "o7.codes" }]

[env.preview.vars]
APP_ORIGIN = "https://preview.o7.codes"
APNS_TOPIC = "codes.o7.mobile"
APNS_KEY_ID = ""
APNS_TEAM_ID = ""

[[env.preview.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.preview.durable_objects.bindings]]
name = "APNS"
class_name = "Apns"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[env.preview.migrations]]
tag = "v2"
new_sqlite_classes = ["Apns"]
