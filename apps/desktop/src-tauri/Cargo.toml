[package]
name = "o7-desktop"
description = "The o7 desktop shell: Tauri window, typed commands and channels over o7-core's sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "o7"

# The library holds everything (so tests and the bindings export can reach it); the binary only
# calls `run`. They have different names on purpose: a bin and a lib that share a name collide on
# Windows debug artifacts.
[lib]
name = "o7_desktop"
path = "src/lib.rs"

[[bin]]
name = "o7"
path = "src/main.rs"

[build-dependencies]
# Embeds the Windows application manifest in test binaries too (build.rs). Already in the tree
# through tauri-build's resource compiler, at this version.
embed-resource = "3.0.12"
tauri-build.workspace = true

[dependencies]
o7-agents.workspace = true
o7-config.workspace = true
o7-core.workspace = true
o7-devices.workspace = true
o7-drivers.workspace = true
o7-process.workspace = true
o7-protocol.workspace = true
o7-remote.workspace = true
# The computer's secure storage for added agent accounts' tokens (agent_tokens.rs): entry names
# are base64url digests, and secret bytes are cleared when dropped.
base64 = "0.22.1"
keyring-core = "1.0.1"
zeroize = "1.9.1"
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-window-state.workspace = true
tauri-specta.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid = { workspace = true, features = ["v4"] }
reqwest.workspace = true
# Native TLS matches the rest of the desktop; signed-version verification is required.
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
# Same release o7-drivers uses: its `run_script` takes a `CancellationToken`.
tokio-util = "0.7.20"
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
sha2.workspace = true
# The browser beside the chat (src/browser): its tabs are wry webviews of their own, outside
# Tauri's IPC, at the release Tauri itself runs and with the features it already enables.
# `devtools` keeps the panel's DevTools in release builds: without it wry offers `open_devtools`
# to debug builds only. Tauri's own window still gets DevTools only from Tauri's feature.
wry = { version = "=0.57.1", default-features = false, features = ["os-webview", "devtools"] }
# Native microphone capture and statically linked offline speech recognition: transcribe.cpp
# runs the bundled Parakeet and Silero VAD models on the CPU (Metal on Apple silicon).
cpal = "=0.18.2"
rubato = "=0.16.2"
transcribe-cpp = "=0.4.1"
# Reading aloud (src/speech): Gradium's Phonon text-to-speech through its own Rust runtime, on
# the CPU, from the model bundled in resources/speech. `hf` reads the model's tokenizer; the
# download, server and GPU features stay off, so the crate makes no network request. `xn` is its
# tensor library, named here only to set how many threads it may use.
ptts = { version = "=0.7.1", default-features = false, features = ["hf"] }
xn = { version = "=0.2.15", default-features = false }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
keepawake = "=0.6.1"
tauri-plugin-notification = "=2.7.0"

[target.'cfg(windows)'.dependencies]
# Credential Manager, for added agent accounts' tokens.
windows-native-keyring-store = { version = "1.1.0", default-features = false }
# Already in the tree through tao and window-vibrancy; it reads the real build number (Mica needs
# build 22000+) without the compatibility shims that make GetVersionEx lie.
windows-version = "0.1.7"
# The browser's WebView2 abilities wry does not wrap (DevTools protocol input and screenshots,
# back and forward state, crashes, saved sign-ins): the releases wry itself uses.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation"] }
# Opening o7 at sign-in (login_start.rs): the current user's Run key. Already in the tree through
# hyper-util, at this version.
windows-registry = "=0.6.1"
# The data cleanup mode (uninstall.rs): its dialogs, attaching to a terminal, waiting for the app
# to exit; the window caption's colours (window.rs); and how much room a disk has, before the
# larger dictation model is fetched unasked (dictation/larger.rs). Raw bindings, already in the
# tree.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# How much room a disk has (statvfs), before the larger dictation model is fetched unasked
# (dictation/larger.rs). Already in the tree, at this version.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop keyring (GNOME Keyring, KWallet or another Secret Service) over D-Bus, for added
# agent accounts' tokens: pure Rust on the zbus the Linux build already has, its session encrypted
# with Rust crypto rather than OpenSSL.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }
# Checks for the AppIndicator library before the tray loads it, since a missing one panics there
# (native_shell). Already in the tree through tao, at this version.
dlopen2 = { version = "0.8.2", default-features = false }
# The browser's pages on Wayland are GTK widgets in the window (src/browser/gtk_layer.rs).
# Already in the tree through tao and wry, at this version.
gtk = "0.18.2"
# The browser's WebKitGTK abilities wry does not wrap: media switched off where GStreamer cannot
# play it, a page process that ended, and page pictures (src/browser/media.rs, snapshot.rs). The
# release and API level wry itself uses.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
# Encodes those pictures as JPEG and PNG off the main thread. Already in the tree through
# o7-core, at this version and with these codecs.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The login keychain, for added agent accounts' tokens.
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }
# "Delete data and move o7 to the Trash" (uninstall.rs): NSFileManager's trashItemAtURL.
# Already in the tree through Tauri, at this version.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
# The quit, page-load and signal tests run the session manager on fake processes and scripted drivers.
o7-drivers = { workspace = true, features = ["testing"] }
o7-process = { workspace = true, features = ["testing"] }
# Paused time makes the window fallback and the demo stream tests instant and deterministic.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
