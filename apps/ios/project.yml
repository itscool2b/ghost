# The iPhone app's Xcode project. Generate it with `apps/ios/scripts/project.sh` (XcodeGen
# 2.45.4); the generated Ghost.xcodeproj is not committed. Settings live in Config/*.xcconfig, and the
# Info.plist and entitlements are written by hand so a change to them shows in review.
name: Ghost
options:
  bundleIdPrefix: dev.onghost
  deploymentTarget:
    iOS: "26.1"
  xcodeVersion: "27.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  GhostKit:
    path: GhostKit
targets:
  Ghost:
    type: application
    platform: iOS
    sources:
      - path: Ghost
        excludes:
          - Info.plist
          - Ghost.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.onghost.mobile
        PRODUCT_NAME: Ghost
        INFOPLIST_FILE: Ghost/Info.plist
        CODE_SIGN_ENTITLEMENTS: Ghost/Ghost.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    dependencies:
      - package: GhostKit
        products:
          - GhostWire
          - GhostCrypto
          - GhostClient
          - GhostTranscript
          - GhostStore
          - GhostTheme
          - GhostMarks
          - GhostMarkdown
          - GhostHighlight
          - GhostMockHost
          - GhostPush
      - target: GhostNotificationService
        embed: true
      - target: GhostWidgets
        embed: true
  # Opens each sealed notification on the phone (Notification Service Extension).
  GhostNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: GhostNotificationService
        excludes:
          - Info.plist
          - GhostNotificationService.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.onghost.mobile.notifications
        PRODUCT_NAME: GhostNotificationService
        INFOPLIST_FILE: GhostNotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: GhostNotificationService/GhostNotificationService.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    dependencies:
      - package: GhostKit
        products:
          - GhostWire
          - GhostCrypto
          - GhostPush
  # The widgets and the Live Activity.
  GhostWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GhostWidgets
        excludes:
          - Info.plist
          - GhostWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.onghost.mobile.widgets
        PRODUCT_NAME: GhostWidgets
        INFOPLIST_FILE: GhostWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: GhostWidgets/GhostWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    dependencies:
      - package: GhostKit
        products:
          - GhostWire
          - GhostCrypto
          - GhostPush
          - GhostTheme
          - GhostMarks
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
  GhostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GhostTests
    dependencies:
      - target: Ghost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Ghost.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Ghost
  GhostUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GhostUITests
    dependencies:
      - target: Ghost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Ghost
schemes:
  Ghost:
    build:
      targets:
        Ghost: all
        GhostTests: [test]
        GhostUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - GhostTests
        - GhostUITests
    archive:
      config: Release
