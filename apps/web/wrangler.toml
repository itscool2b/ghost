# Static assets only. The site has no application API; the remote relay is its own Worker on
# /api/remote/*.
name = "ghost-web-local"
compatibility_date = "2026-10-26"
workers_dev = false
preview_urls = false
[assets]
directory = "./build/client"
not_found_handling = "404-page"
[env.production]
name = "ghost-web"
account_id = "5feb14f2fe605875bcf1472f348cb7ed"
routes = [{ pattern = "onghost.dev/*", zone_name = "onghost.dev" }]
[env.production.assets]
directory = "./build/client"
not_found_handling = "404-page"

[env.preview]
name = "ghost-web-preview"
account_id = "5feb14f2fe605875bcf1472f348cb7ed"
routes = [{ pattern = "preview.onghost.dev/*", zone_name = "onghost.dev" }]
[env.preview.assets]
directory = "./build/client"
not_found_handling = "404-page"
