[package]
name = "ghost-drivers"
description = "Agent drivers for Ghost: the driver contract, the frame batcher every driver shares, the ACP client and the scripted mock agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `testing`: ScriptedDriver, ScriptedDriverFactory and DirectSpawner, for the session manager's tests.
testing = []
# `replay`: the replay harness, which runs the real ACP driver against a fake agent playing a recorded
# protocol log on paused time. Only ghost-cli and tests turn it on. It includes `testing`, so the harness
# may use those doubles and builds the same alone (ghost-cli) as in workspace runs, where ghost-core's
# dev-dependency turns both on.
replay = ["testing", "ghost-process/testing", "tokio/test-util"]

[dependencies]
ghost-process.workspace = true
ghost-protocol.workspace = true
base64 = "0.23.1"
futures.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
tokio-util = "0.7.20"
tracing.workspace = true
tempfile.workspace = true
# Grapheme boundaries, so a split delta never cuts an emoji sequence or an accent off its letter.
unicode-segmentation = "1.13.3"
uuid.workspace = true

[dev-dependencies]
# The ACP schema, for the conformance tests only: Ghost has no runtime dependency on the SDK.
agent-client-protocol-schema = { version = "=1.12.0", features = ["unstable"] }
ghost-process = { workspace = true, features = ["testing"] }
# `schema_for!`, to list every `sessionUpdate` tag the schema defines.
schemars = "1.2.3"
# Validate native fixtures against the CLI-generated schema without network or file resolution.
jsonschema = { version = "0.60.1", default-features = false }
# Paused time makes the pacing and cancellation tests deterministic.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
