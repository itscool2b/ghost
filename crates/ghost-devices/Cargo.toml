[package]
name = "ghost-devices"
description = "Phones for Ghost: Android's SDK, emulators and adb, a device's screen and input, and the tools agents use on it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# SDK archives are zip files, unpacked by the code every fetched tool is unpacked with.
ghost-fetch.workspace = true
# Screenshots are read and shrunk for agents. The version the workspace already locks.
png = "0.18.1"
# The emulator in a job object (Windows) or a process group (Unix), as agents' processes are.
process-wrap = { version = "=10.0.1", default-features = false, features = [
    "tokio1",
    "creation-flags",
    "job-object",
    "kill-on-drop",
    "process-group",
] }
# The repository index and uiautomator's dump are XML. The version the workspace already locks.
quick-xml = "0.42.0"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# Google's index gives a SHA-1 for each archive; the bundled scrcpy server is pinned by SHA-256.
sha1 = "0.11.0"
sha2.workspace = true
specta.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# The "no console window" flag, in the type the job object wrapper takes.
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
# Test archives are written with it. The version the updater and ghost-fetch already lock.
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tokio = { workspace = true, features = ["test-util", "net"] }

[lints]
workspace = true
