[package]
name = "ghost-process"
description = "Agent processes for Ghost: spawning, line framing, shutdown, leftover cleanup, the environment agents start with, and protocol logs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `testing`: FakeSpawner and FakeControl, in-memory agent processes for other crates' tests.
testing = []

[dependencies]
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
futures.workspace = true
# Process groups, sessions and Windows job objects around tokio's Command. Default features off:
# its `tracing` feature is not needed, and `tokio1` is the only runtime used.
process-wrap = { version = "=10.0.1", default-features = false, features = [
    "tokio1",
    "creation-flags",
    "job-object",
    "kill-on-drop",
    "process-group",
    "process-session",
    "reset-sigmask",
] }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "net"] }
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
# killpg for process groups, getsid for the leftover registry, the passwd entry's shell.
nix = { version = "0.31.3", features = ["signal", "process", "user", "term", "fs"] }

[target.'cfg(windows)'.dependencies]
# ConPTY and suspended, job-contained native terminal creation; the process listing behind the
# Processes page (ToolHelp snapshots, memory counters, command lines through NtQueryInformationProcess).
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Wdk_System_Threading"] }
# The machine and user environment from the registry, through its safe API.
winreg = "0.56.0"

[dev-dependencies]
tempfile.workspace = true
# Paused time makes the shutdown chain and resolver timeouts deterministic.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
